<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLab</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="welcome-screen fade">
    <div class="welcome-content">
      <h2>Math Lab</h2>
      <p>!مختبرك التفاعلي لاستكشاف سحر الرياضيات</p>
      <button id="startBtn" class="start-button">Get Started</button>
    </div>
  </div>

  <div id="lab-interface" class="hidden">
    <div class="lab-layout">
      
      <div class="column">
        <!-- Geometry category -->
        <div class="category" id="geometryBtn">
          Geometry 
          <div class="menu" id="geoDropdown"> 
            <div class="menuitems">
              <div class="menu-item" id="pythagorasBtn">Pythagorean Theorem</div>
            <div class="menu-item" id="congruenceBtn">Congruence</div>
            <div class="menu-item" id="polygonBtn">Polygons</div>
            </div>
          </div>
        </div>
        
        <div class="divider"></div>
        <!-- Circles category -->
        <div class="category" id="circlesBtn">
          Circles
          <div class="menu" id="circlesDropdown"> 
            <div class="menuitems">
              <div class="menu-item" id="circlePropsBtn">Properties</div>
              <div class="menu-item" id="subtendedAnglesBtn">Subtended Angles</div>
              <div class="menu-item" id="sectorSegmentBtn">Sectors & Segments</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="category" id="trigBtn">Trigonometry
          <div class="menu" id="trigDropdown">
            <div class="menuitems">
            <div class="menu-item">X</div>
            <div class="menu-item">Y</div>
            <div class="menu-item">Z</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="category">Vectors</div>
      </div>

      <div class="main-area">
        
        <div class="info-wrapper">
          <button id="info">i</button>
            <div id="funFacts" class="is-hidden">
            </div>
            
          </div>
        
        <div class="canvas-area" id="canvas-container">
        </div>

          <div class="data-panel" id="dataPanel">
          <p class="dataP">Laws and theorems will appear here.</p>
          </div>
      </div>

    </div>

    
    
  </div>
  
  <script type="module" src="Js/main.js"></script>
</body>
</html>
